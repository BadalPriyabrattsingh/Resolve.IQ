<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResolveIQ</title>
    <meta name="description" content="Enterprise SRE & software engineering incident management platform with real-time tracking, timeline telemetry, evidence capture, and service mapping." />
    <meta property="og:title" content="ResolveIQ" />
    <meta property="og:description" content="Enterprise SRE & software engineering incident management platform with real-time tracking, timeline telemetry, evidence capture, and service mapping." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('resolveiq-theme');
          var theme = saved;
          if (!theme || (theme !== 'dark' && theme !== 'light' && theme !== 'system')) {
            theme = 'system';
          }

          var isDark = false;
          if (theme === 'dark') {
            isDark = true;
          } else if (theme === 'light') {
            isDark = false;
          } else {
            isDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }

          var docEl = document.documentElement;
          if (isDark) {
            docEl.classList.remove('light');
            docEl.classList.add('dark');
            docEl.setAttribute('data-theme', 'dark');
            docEl.style.colorScheme = 'dark';
          } else {
            docEl.classList.remove('dark');
            docEl.classList.add('light');
            docEl.setAttribute('data-theme', 'light');
            docEl.style.colorScheme = 'light';
          }

          var lightVars = {
            '--bg-page': '#F8FAFC',
            '--bg-surface': '#FFFFFF',
            '--bg-surface-elevated': '#F1F5F9',
            '--bg-surface-subtle': '#F8FAFC',
            '--bg-surface-hover': '#F1F5F9',
            '--border-subtle': 'rgba(0, 0, 0, 0.08)',
            '--border-medium': 'rgba(0, 0, 0, 0.14)',
            '--border-strong': 'rgba(0, 0, 0, 0.22)',
            '--text-primary': '#0F172A',
            '--text-secondary': '#475569',
            '--text-muted': '#64748B',
            '--text-faint': '#94A3B8',
            '--shadow-subtle': '0 1px 2px 0 rgba(15, 23, 42, 0.04)',
            '--shadow-card': '0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04)',
            '--shadow-elevated': '0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04)',
            '--accent': '#0D9488',
            '--accent-light': '#14B8A6',
            '--accent-subtle': 'rgba(13, 148, 136, 0.08)',
            '--accent-border': 'rgba(13, 148, 136, 0.22)',
            '--sev1-red': '#DC2626',
            '--sev1-subtle': 'rgba(220, 38, 38, 0.08)',
            '--sev1-border': 'rgba(220, 38, 38, 0.22)',
            '--sev2-orange': '#EA580C',
            '--sev2-subtle': 'rgba(234, 88, 12, 0.08)',
            '--sev2-border': 'rgba(234, 88, 12, 0.22)',
            '--sev3-yellow': '#CA8A04',
            '--sev3-subtle': 'rgba(202, 138, 4, 0.08)',
            '--sev3-border': 'rgba(202, 138, 4, 0.22)',
            '--sev4-teal': '#0891B2',
            '--sev4-subtle': 'rgba(8, 145, 178, 0.08)',
            '--sev4-border': 'rgba(8, 145, 178, 0.22)',
            '--success-green': '#059669',
            '--success-subtle': 'rgba(5, 150, 105, 0.08)'
          };

          var darkVars = {
            '--bg-page': '#0C1015',
            '--bg-surface': '#121820',
            '--bg-surface-elevated': '#18202A',
            '--bg-surface-subtle': '#0F141B',
            '--bg-surface-hover': '#1A232E',
            '--border-subtle': 'rgba(255, 255, 255, 0.07)',
            '--border-medium': 'rgba(255, 255, 255, 0.12)',
            '--border-strong': 'rgba(255, 255, 255, 0.2)',
            '--text-primary': '#F1F5F9',
            '--text-secondary': '#94A3B8',
            '--text-muted': '#64748B',
            '--text-faint': '#475569',
            '--shadow-subtle': '0 1px 2px 0 rgba(0, 0, 0, 0.35)',
            '--shadow-card': '0 1px 3px 0 rgba(0, 0, 0, 0.4), 0 1px 2px -1px rgba(0, 0, 0, 0.3)',
            '--shadow-elevated': '0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4)',
            '--accent': '#14B8A6',
            '--accent-light': '#2DD4BF',
            '--accent-subtle': 'rgba(20, 184, 166, 0.12)',
            '--accent-border': 'rgba(20, 184, 166, 0.28)',
            '--sev1-red': '#EF4444',
            '--sev1-subtle': 'rgba(239, 68, 68, 0.12)',
            '--sev1-border': 'rgba(239, 68, 68, 0.28)',
            '--sev2-orange': '#F97316',
            '--sev2-subtle': 'rgba(249, 115, 22, 0.12)',
            '--sev2-border': 'rgba(249, 115, 22, 0.28)',
            '--sev3-yellow': '#EAB308',
            '--sev3-subtle': 'rgba(234, 179, 8, 0.12)',
            '--sev3-border': 'rgba(234, 179, 8, 0.28)',
            '--sev4-teal': '#06B6D4',
            '--sev4-subtle': 'rgba(6, 182, 212, 0.12)',
            '--sev4-border': 'rgba(6, 182, 212, 0.28)',
            '--success-green': '#10B981',
            '--success-subtle': 'rgba(16, 185, 129, 0.12)'
          };

          var activeVars = isDark ? darkVars : lightVars;
          for (var key in activeVars) {
            docEl.style.setProperty(key, activeVars[key]);
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
